# 跑裸核用户请自行去掉下方控制面板模块的注释。
# 机场订阅
proxy-providers:
  Airport1:
    url: "clash订阅地址替换"
    type: http
    interval: 86400
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
    proxy: DIRECT
    header: #请求头
    # 排除关键词功能
    User-Agent: #这个是一个机场生效
        - "clash-verge/v2.4.0"
        - "Clash"
        - "mihomo"
        - "Clash.meta"
    filter: "^(?!.*(最新客户端|官网下载|一元机场|剩余流量|长期有效|\\b25\\b)).*$"
    override:	#额外参数
        udp: true #开启机场节点udp
#        down: "50 Mbps"	#定义上传下载速度
#        up: "10 Mbps"
#        skip-cert-verify: true	#绕过证书
    client-fingerprint: random
  Airport2:
    url: ""
    type: http
    interval: 86400
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
    proxy: DIRECT
    header: #请求头
       User-Agent: #这个是一个机场生效
        - "clash-verge/v2.4.0"
        - "Clash"
        - "mihomo"
        - "Clash.meta"
    # 排除关键词功能
    filter: "^(?!.*(最新客户端|官网下载|一元机场|剩余流量|长期有效|\\b25\\b)).*$"
    override:	#额外参数
        udp: true #开启机场节点udp
#        down: "50 Mbps"	#定义上传下载速度
#        up: "10 Mbps"
#        skip-cert-verify: true	#绕过证书
    client-fingerprint: random
  Airport3:
    url: ""
    type: http
    interval: 86400
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 700
    proxy: DIRECT
    header: #请求头
    # 排除关键词功能
    filter: "^(?!.*(最新客户端|官网下载|一元机场|剩余流量|长期有效|\\b25\\b)).*$"
    User-Agent: #这个是一个机场生效
        - "Clash"
        - "mihomo"
        - "Clash.meta"
    override:	#额外参数
        udp: true #开启机场节点udp
#        down: "50 Mbps"	#定义上传下载速度
#        up: "10 Mbps"
#        skip-cert-verify: true	#绕过证书
    client-fingerprint: random


# 节点信息
#proxies:
#  - {name: DIRECT, type: direct}

# 全局配置 
mixed-port: 7890
allow-lan: true
bind-address: "*"
ipv6: false
unified-delay: true
tcp-concurrent: true
log-level: warning
#global-client-fingerprint: chrome
keep-alive-idle: 600
keep-alive-interval: 15
profile:
  store-selected: true
  store-fake-ip: true

# 为防止使用插件朋友遇到面板问题，我注释掉了此模块。
#external-controller: 0.0.0.0:9090
#secret: ""
#external-ui: ui
#external-ui-name: zashboard
#external-ui-url: "https://github.com/Zephyruso/zashboard/archive/refs/heads/gh-pages.zip"

# 嗅探（fakeip下其实可以不用嗅探）
sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"

# 入站
tun:
  enable: true
  # system/gvisor/mixed废弃mips
  #stack: mixed
  stack: mips
  dns-hijack: ["any:53", "tcp://any:53"]
  #使用nikki，混入全部不修改的情况，开启接口指定为nikki
  device: nikki
  #使用仅内核自行修改下面三项为true
  auto-route: false
  #auto-reDIRECT: false
  auto-redirect: false
  auto-detect-interface: false

# DNS模块
dns:
  enable: true
  cache-algorithm: arc
  listen: 0.0.0.0:1053
  ipv6: false
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-range: 28.0.0.1/8
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "rule-set:fakeipfilter_domain"
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  proxy-server-nameserver:
    #- https://223.5.5.5/dns-query
    #- https://119.29.29.29/dns-query
    - https://dns.alidns.com/dns-query
    - https://dns.quad9.net/dns-query
    - https://doh.pub/dns-query
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
 
